<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../Duan-4/assets/css/reset.css" />
    <link rel="stylesheet" href="../Duan-4/assets/css/styles.css" />
    <title>Dự Án 4</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__navbar">
          <div class="logo">
            <img src="./assets/images/Logo.svg" alt="" class="logo__image" />
          </div>
          <div class="header__navbar__menu">
            <ul class="list_menu">
              <li class="item_menu">
                <a href="#!" class="text_menu text_menu-primary">Home</a>
              </li>
              <li class="item_menu">
                <a href="#!" class="text_menu">About</a>
              </li>
              <li class="item_menu">
                <a href="#!" class="text_menu">Services & Rates</a>
              </li>
              <li class="item_menu">
                <a href="#!" class="text_menu">Reviewa</a>
              </li>
              <li class="item_menu">
                <a href="#!" class="text_menu">Contacts us</a>
              </li>
            </ul>
          </div>
          <div class="action">
            <a href="#!"
              ><div class="button button_nav text_button">Sign up</div></a
            >
          </div>
        </div>
        <div class="header__body">
          <div class="card_left">
            <div class="cat_left">
              <img
                src="./assets/images/cat__header-left.svg"
                alt=""
                class="cat_before"
              />

              <div class="images_primary">
                <img
                  src="./assets/images/cat_header.png"
                  alt="cat primary"
                  class="cat"
                />
              </div>
              <img
                src="./assets/images/cat__header-right.svg"
                alt=""
                class="cat_after"
              />
            </div>
            <div class="dog_right">
              <img src="./assets/images/dog_header.png" alt="dog" class="dog" />
            </div>
            <div class="information">
              <div class="card_top">
                <div class="images_information">
                  <img
                    src="./assets/images/information_tangle_header.png"
                    alt="information_tangle_header"
                  />
                </div>
                <div class="text_information">
                  <p class="title">Pet Health</p>
                  <div class="desc"></div>
                  <div class="desc desc-2"></div>
                </div>
              </div>
              <div class="line"></div>

              <div class="card_bottom">
                <div class="images_information">
                  <img
                    src="./assets/images/information_tangle_header-1.png"
                    alt="information_tangle_header"
                  />
                </div>
                <div class="text_information">
                  <p class="title">Pet Health</p>
                  <div class="desc"></div>
                  <div class="desc desc-2"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="card_right">
            <div class="text_card">
              <p class="title_card">Established & Trusted Pet Care Service</p>
              <p class="desc_card">
                Discover a wide variety of Pawsitive services to choose from,
                including daycare, private walks, office duty and spa.
              </p>
            </div>
            <div class="action_card">
              <a class="button button_hero" href="#!">
                <span>Book a Meet</span>
                <div class="dot_right">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="5"
                    height="6"
                    viewBox="0 0 5 6"
                    fill="none"
                  >
                    <path
                      d="M1.48584 0.5L3.98584 3L1.48584 5.5"
                      stroke="#FD5056"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </div>
              </a>
              <a class="link_action" href="#!">Schedule a Call</a>
            </div>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
