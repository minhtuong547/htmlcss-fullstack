            </div>
            <div class="follow_social">

              <div class="social">
                <a href="#!"

                <a href="#!"

                    class="icon"

              </div>
            </div>
            <img
              src="./assets/images/deco_human_hero-bottom.svg"
              alt="deco_human_hero-bottom"
              class="deco_bottom"
            />
          </div>
        </div>
